[package]
name = "citeme-engine-core"
version = "0.3.0"
edition = "2021"

[dependencies]
hayagriva = { version = "0.9", default-features = false, features = ["biblatex", "csl-json"] }
biblatex = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "citeme_bench"
harness = false
