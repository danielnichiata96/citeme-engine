name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust:
    name: Rust tests (unit + corpus + property)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  wasm-js:
    name: Wasm build + JS package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The CLI must be exactly the `wasm-bindgen` crate version in Cargo.lock.
      - name: Read the wasm-bindgen version from Cargo.lock
        id: wasm-bindgen
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      # The CiteMe app runs Node 24.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # wasm-opt is not installed in CI; build.sh skips it gracefully.
      - run: ./build.sh
      - run: npm test
        working-directory: js
