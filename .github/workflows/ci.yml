name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust:
    name: Rust tests (unit + corpus + property)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  wasm-js:
    name: Wasm build + JS package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Must match the `wasm-bindgen` crate version in Cargo.lock — bump together.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.114
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # wasm-opt is not installed in CI; build.sh skips it gracefully.
      - run: ./build.sh
      - run: npm test
        working-directory: js
